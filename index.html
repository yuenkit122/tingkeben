<script>
/* 外观：跟随系统 / 浅色 / 深色。在样式表之前定下来，打开时不会先闪一下白 */
(function () {
  var t = 'auto'; try { t = (JSON.parse(localStorage.getItem('tingkeben.settings') || '{}').theme) || 'auto'; } catch (e) {}
  var m = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : { matches: false };
  function ap() {
    var d = t === 'dark' || (t === 'auto' && m.matches);
    document.documentElement.dataset.theme = d ? 'dark' : 'light';
    var mc = document.querySelector('meta[name=theme-color]'); if (mc) mc.content = d ? '#0E1220' : '#2C47A5';
    try { document.dispatchEvent(new CustomEvent('tk-theme', { detail: d ? 'dark' : 'light' })); } catch (e) {}
  }
  ap();
  if (m.addEventListener) m.addEventListener('change', ap);
  window.__tkTheme = function (v) { t = v || 'auto'; ap(); };
})();
</script>
<link rel="stylesheet" href="styles.css?v=11030114">
</head>
<body>
<!-- 开屏（2026-11-01 v3）：深色电影感 + 终端开机。ASCII 字标从乱码「解码」成型、扫光，下面逐行跑自检。
     点一下 / 按任意键可以跳过；JS 没跑起来也会在 4 秒后自己退场；系统「减弱动态效果」时只静态显示。 -->
<div id="splash" aria-hidden="true">
  <canvas class="sp-field" id="sp-field"></canvas>
  <div class="sp-vignette"></div>
  <div class="sp-stage">
    <div class="sp-mark"><span class="sp-orbit"></span><img src="icon-192.png" alt=""></div>
    <pre class="sp-ascii" id="sp-ascii" data-art="████████╗██╗███╗   ██╗ ██████╗ ██╗  ██╗███████╗██████╗ ███████╗███╗   ██╗\n╚══██╔══╝██║████╗  ██║██╔════╝ ██║ ██╔╝██╔════╝██╔══██╗██╔════╝████╗  ██║\n   ██║   ██║██╔██╗ ██║██║  ███╗█████╔╝ █████╗  ██████╔╝█████╗  ██╔██╗ ██║\n   ██║   ██║██║╚██╗██║██║   ██║██╔═██╗ ██╔══╝  ██╔══██╗██╔══╝  ██║╚██╗██║\n   ██║   ██║██║ ╚████║╚██████╔╝██║  ██╗███████╗██████╔╝███████╗██║ ╚████║\n   ╚═╝   ╚═╝╚═╝  ╚═══╝ ╚═════╝ ╚═╝  ╚═╝╚══════╝╚═════╝ ╚══════╝╚═╝  ╚═══╝"></pre>
    <div class="sp-name"><b>听课本</b><span class="sp-ver" id="sp-ver"></span></div>
    <div class="sp-sub">COURSEWARE · NOTES · INK · AUDIO</div>
    <div class="sp-term">
      <div class="sp-prompt"><span class="sp-ps">yuenkit@tingkeben</span><span class="sp-path">~</span><span class="sp-cmd" id="sp-cmd"></span><i class="sp-caret"></i></div>
      <ul class="sp-checks" id="sp-checks" aria-live="polite"></ul>
    </div>
    <div class="sp-bar"><i id="sp-prog"></i></div>
    <div class="sp-credit">crafted by <b>yuenkit</b> · 个人使用</div>
  </div>
  <div class="sp-skip">点击任意处跳过</div>
</div>
<script>
/* 开屏动画：放在页面最前面，主程序还在加载时就开始播 */
(function () {
  var sp = document.getElementById('splash'); if (!sp) return;
  /* v4 外观：满屏校园地图（每次随机生成）+ 金色路线串起 课件→课堂→笔记→复习 + 左下提示 + 右下转圈 */
  (function () {
    sp.classList.add('sp-v4');
    var W = 1600, H = 1000, r = Math.random, o = [];
    o.push('<rect width="1600" height="1000" fill="#0B1222"/>');
    o.push('<path d="M-50 ' + (620 + r() * 80) + ' C 400 ' + (520 + r() * 80) + ', 900 ' + (760 + r() * 60) + ', 1650 ' + (560 + r() * 80) + '" stroke="#12304A" stroke-width="90" fill="none"/>');
    for (var x = 0; x < W; x += 100) for (var y = 0; y < H; y += 90) {
      if (r() < .16) continue;
      var c = r() < .1 ? '#14301F' : r() < .5 ? '#121B30' : '#16213A';
      o.push('<rect x="' + (x + 12) + '" y="' + (y + 12) + '" width="' + (76 - r() * 20) + '" height="' + (66 - r() * 18) + '" rx="4" fill="' + c + '"/>');
    }
    for (var gx = 0; gx <= W; gx += 100) o.push('<path d="M' + gx + ' 0V' + H + '" stroke="#1E2A44" stroke-width="' + (gx % 400 ? 2 : 6) + '"/>');
    for (var gy = 0; gy <= H; gy += 90) o.push('<path d="M0 ' + gy + 'H' + W + '" stroke="#1E2A44" stroke-width="' + (gy % 360 ? 2 : 6) + '"/>');
    var P = [[300, 270, '课件'], [700, 450, '课堂'], [1100, 270, '笔记'], [1300, 630, '复习']], d = 'M' + P[0][0] + ' ' + P[0][1];
    for (var i = 1; i < P.length; i++) d += ' H' + P[i][0] + ' V' + P[i][1];
    o.push('<path class="rt" d="' + d + '" stroke="#FFD27A" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="14 10"/>');
    P.forEach(function (p, i) {
      o.push('<g class="pin" style="animation-delay:' + (.6 + i * .8) + 's"><circle cx="' + p[0] + '" cy="' + p[1] + '" r="16" fill="#FFD27A"/><circle cx="' + p[0] + '" cy="' + p[1] + '" r="6" fill="#0B1222"/><text x="' + (p[0] + 24) + '" y="' + (p[1] + 7) + '" fill="#F4F7FF" font-size="22" font-weight="700" font-family="-apple-system,PingFang SC,sans-serif">' + p[2] + '</text></g>');
    });
    var m = document.createElement('div'); m.className = 'sp-map';
    m.innerHTML = '<svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">' + o.join('') + '</svg>';
    sp.insertBefore(m, sp.querySelector('.sp-vignette'));
    var TIPS = ['上课前点「上课」开个空白工作台，先录音，课件到了再加。', '没听懂就点「❓ 没听懂」，课后会用中文重新讲那一段。', '左边选哪份课件，右边就只显示那份课件的笔记。', '课后点「优化 AI 笔记」，老师讲的和你手写的会一起整理进去。', '「重点」里点「已掌握」，复习页会帮你算还剩多少。', '考前在课程页「考前复习」里做一套模拟考试。'];
    var tip = document.createElement('div'); tip.className = 'sp-tip'; tip.innerHTML = '<b>提示</b>' + TIPS[Math.floor(r() * TIPS.length)];
    var nm = sp.querySelector('.sp-name'); if (nm) nm.parentNode.insertBefore(tip, nm.nextSibling);
    var ld = document.createElement('div'); ld.className = 'sp-loader'; ld.innerHTML = '<i></i><span>LOADING</span>'; sp.appendChild(ld);
  })();
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pre = document.getElementById('sp-ascii'), art = pre.getAttribute('data-art').replace(/\\n/g, '\n');
  var v = (document.querySelector('link[href*="styles.css?v="]') || {}).href || '';
  var ver = (v.match(/v=(\d+)/) || [])[1] || '';
  var vEl = document.getElementById('sp-ver'); if (vEl && ver) vEl.textContent = 'build ' + ver;
  // 1. ASCII 字标：从左到右一列列「解码」
  var GL = '01<>/\\|=+*#%@$&░▒▓';
  var cols = art.split('\n')[0].length, t0 = performance.now(), DUR = reduce ? 0 : 900;
  function frame(now) {
    var k = DUR ? Math.min(1, (now - t0) / DUR) : 1, edge = k * (cols + 14), out = '';
    var rows = art.split('\n');
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r], line = '';
      for (var c = 0; c < row.length; c++) {
        var ch = row[c];
        if (ch === ' ') { line += ' '; continue; }
        if (c < edge - 14) line += ch;
        else if (c < edge) line += GL[(Math.random() * GL.length) | 0];
        else line += ' ';
      }
      out += line + (r < rows.length - 1 ? '\n' : '');
    }
    pre.textContent = out;
    if (k < 1) requestAnimationFrame(frame); else { pre.textContent = art; pre.classList.add('lit'); }
  }
  requestAnimationFrame(frame);
  // 2. 终端里打一行命令
  var cmd = './tingkeben --boot', cEl = document.getElementById('sp-cmd'), i = 0;
  (function type() { if (!cEl) return; cEl.textContent = cmd.slice(0, ++i); if (i < cmd.length) setTimeout(type, reduce ? 0 : 26); })();
  // 3. 背景：往中心汇聚的光点（很少的点，不费电）
  var cv = document.getElementById('sp-field');
  if (cv && !reduce) {
    var ctx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1), W, H, P = [];
    var size = function () { W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr; };
    size(); addEventListener('resize', size);
    for (var n = 0; n < 90; n++) P.push({ a: Math.random() * 6.283, r: Math.random(), s: .002 + Math.random() * .006, z: Math.random() });
    (function tick() {
      if (!sp.isConnected || sp.classList.contains('out')) return;
      ctx.clearRect(0, 0, W, H);
      var cx = W / 2, cy = H * .42, R = Math.hypot(W, H) * .55;
      for (var j = 0; j < P.length; j++) {
        var p = P[j]; p.r -= p.s; if (p.r < .02) { p.r = 1; p.a = Math.random() * 6.283; }
        var x = cx + Math.cos(p.a) * p.r * R, y = cy + Math.sin(p.a) * p.r * R * .7;
        var al = Math.min(1, (1 - p.r) * 1.6) * (.25 + p.z * .55);
        ctx.fillStyle = 'rgba(' + (p.z > .7 ? '255,214,120' : '125,170,255') + ',' + al + ')';
        ctx.fillRect(x, y, (1 + p.z * 1.6) * dpr, (1 + p.z * 1.6) * dpr);
      }
      requestAnimationFrame(tick);
    })();
  }
  // 点一下 / 按键跳过
  var skip = function () { window.__tkSplashSkip = true; if (window.exitSplash) window.exitSplash(0); else { sp.classList.add('out'); setTimeout(function () { sp.remove(); }, 600); } };
  sp.addEventListener('pointerdown', skip); addEventListener('keydown', function k() { removeEventListener('keydown', k); if (document.getElementById('splash')) skip(); });
})();
</script>
